default-lease-time 600;
max-lease-time 7200;
authoritative;


#Scope LAN

subnet 192.168.56.0 netmask 255.255.255.0 {
    range 192.168.56.100 192.168.56.200;
    option routers 192.168.56.254;
    option domain-name-servers 192.168.56.10;
    option domain-search "clinicanova.local";
}

#Scope DMZ

subnet 192.168.57.0 netmask 255.255.255.0 {
    range 192.168.57.100 192.168.57.200;
    option routers 192.168.57.254;
    option domain-name-servers 192.168.56.10;
    option domain-search "clinicanova.local";
}


#Reserver por MAC

host cn-mon-lab {
    hardware ethernet 08:00:27:ee:5c:17;
    fixed-address 192.168.56.20;
}

